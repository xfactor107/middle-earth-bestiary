<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Ink color: dark brown on light tabs, parchment on dark tabs -->
  <style>
    svg { color: #3A2312; }
    @media (prefers-color-scheme: dark) { svg { color: #E8D8B8; } }
  </style>

  <!-- Inner & Outer Compass Rings -->
  <circle cx="50" cy="50" r="21" fill="none" stroke="currentColor" stroke-width="1.8" />
  <circle cx="50" cy="50" r="16.5" fill="none" stroke="currentColor" stroke-width="1.4" />

  <!-- Secondary Diagonal Points (NW, NE, SE, SW) -->
  <g stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" fill="none">
    <polygon points="50,50 47,44 68,32 56,47" />
    <polygon points="50,50 44,53 32,32 47,44" />
    <polygon points="50,50 53,56 32,68 44,53" />
    <polygon points="50,50 56,47 68,68 53,56" />
  </g>

  <!-- Primary 4 Points (North, South, East, West) with Shaded Facets -->
  <polygon points="50,50 50,6 44,43" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
  <polygon points="50,50 50,6 56,43" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
  <polygon points="50,50 50,94 44,57" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
  <polygon points="50,50 50,94 56,57" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
  <polygon points="50,50 94,50 57,44" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
  <polygon points="50,50 94,50 57,56" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
  <polygon points="50,50 6,50 43,44" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
  <polygon points="50,50 6,50 43,56" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />

  <!-- Center Pin -->
  <circle cx="50" cy="50" r="1.5" fill="currentColor" />
</svg>
